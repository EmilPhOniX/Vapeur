services:
  mysql:
    image: mysql:8.0
    container_name: vapeur_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-1234}'
      MYSQL_DATABASE: '${DB_NAME:-temp}'
      MYSQL_USER: '${DB_USER:-temp}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-1234}'
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-1234}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vapeur_network

  app:
    build: .
    container_name: vapeur_app
    restart: always
    command: [ "sh", "-c", "npm install && npx prisma db push && npx prisma db execute --schema prisma/schema.prisma --file prisma/seed-default-genres.sql && npx prisma generate && node app/server.js" ]
    environment:
      PORT: '${APP_PORT:-3000}'
      DATABASE_URL: 'mysql://${DB_USER:-temp}:${DB_PASSWORD:-1234}@mysql:3306/${DB_NAME:-temp}'
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - vapeur_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vapeur_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: '${DB_USER:-temp}'
      PMA_PASSWORD: '${DB_PASSWORD:-1234}'
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vapeur_network

volumes:
  mysql_data:


networks:
  vapeur_network:
    driver: bridge
